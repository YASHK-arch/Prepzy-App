<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revision Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="styles/dashboard.css">
    <link rel="stylesheet" href="QUIZ/floating notification.css">
</head>
<body>
    <div class="navbar">
        <a href="#home" id="home">
            <img src="logo.png" alt="Prepzy Logo" class="nav-logo" width="30px" height="30px" style="padding-right: 8px">
            Prepzy
        </a>
        <div class="dropdown">
            <button class="dropbtn">Subject 
                <i class="fa fa-caret-down"></i>
            </button>
            <div class="dropdown-content">
                <a href="subjects/java.html">DSA</a>
                <a href="subjects/js.html">JS</a>
                <a href="#" id="nav_development">Maths</a>
            </div>
        </div> 
    </div>

    <div class="container">
        <header class="global-stats">
            <div class="stat-card main-progress">
                <h2>Global Progress: <span id="overall-percent">0%</span></h2>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" style="width: 0%; background: #4CAF50;"></div>
                </div>
               <p>
  🔥 14-Day Revision Streak Target |
  <span class="flicker">📅 Exam in <span id="exam-days">--</span> Days</span>
               </p>
            </div>
        </header>
       
        <main class="topic-grid">
            <div class="topic-card" style="border-top: 5px solid #4CAF50;">
                <div class="card-content">
                    <h3>DSA</h3>
                    <p class="count">Syncing...</p>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" style="width: 0%; background: #4CAF50;"></div>
                    </div>
                    <span class="percentage-label">0%</span>
                </div>
                <div class="card-actions">
                    <a href="subjects/java.html" style="text-decoration: none;">
                        <button class="btn-primary">Continue Revision</button>
                    </a>
                </div>
            </div>

            <div class="topic-card" style="border-top: 5px solid #2196F3;">
                <div class="card-content">
                    <h3>Web Dev: Javascript</h3>
                    <p class="count">Syncing...</p>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" style="width: 0%; background: #2196F3;"></div>
                    </div>
                    <span class="percentage-label">0%</span>
                </div>
                <div class="card-actions">
                    <a href="subjects/js.html" style="text-decoration: none;">
                        <button class="btn-primary ">Continue Revision</button>
                    </a>
                </div>
            </div>

            <div class="topic-card" style="border-top: 5px solid #FFC107;">
                <div class="card-content">
                    <h3>Mathematics</h3>
                    <p class="count">Syncing...</p>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" style="width: 0%; background: #FFC107;"></div>
                    </div>
                    <span class="percentage-label">0%</span>
                </div>
                <div class="card-actions">
                    <a href="#" style="text-decoration: none;">
                        <button class="under-development">No Content Available</button>
                    </a>
                </div>
            </div>
        </main>

        <footer>
            <button class="btn-quiz" id="syllabusBtn">View Trimester Syllabus</button>
        </footer>
    </div>
<a href = "subjects/java.html#gift2"><div id="toast-container"> </div></a>

    <script src="js-integration/dashboard.js"></script>
     <script src="QUIZ/toast.js"></script>

     <script>
        // ===== EXAM COUNTDOWN LOGIC =====
        const examDate = new Date("2026-03-28");
        const today = new Date();

        today.setHours(0, 0, 0, 0);
        examDate.setHours(0, 0, 0, 0);

        const diffTime = examDate - today;
        const daysLeft = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        const examDaysSpan = document.getElementById("exam-days");

        if (daysLeft > 0) {
        examDaysSpan.textContent = daysLeft;
        } else if (daysLeft === 0) {
        examDaysSpan.textContent = "Today 🎯";
        } else {
        examDaysSpan.textContent = "Completed ✅";
        }

        let mthbtn = document.querySelector('.under-development');
        let nav_mthbtn = document.querySelector('#nav_development');

        mthbtn.addEventListener('click', function(){
            alert('No problems available for now.....')
        })
        nav_mthbtn.addEventListener('click', function(){
            alert('No problems available for now.....')
        })
     </script>
</body>
</html>
